# Fly.io config for the AZI backend preview.
# Rename `app` if the name is taken (must be globally unique on Fly).
app = "azi-backend-preview"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"
  PORT = "8080"
  # DATABASE_URL and JWT_SECRET are set as secrets, not here (see deploy steps).

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm so the API never pays a cold-boot on the first
  # request after idle (the main source of FE latency). "suspend" resumes
  # faster than a full stop if scaling-down ever occurs.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
